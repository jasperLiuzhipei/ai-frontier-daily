[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-daily"
version = "0.1.0"
description = "Self-iterating daily AI frontier briefing focused on Agent Harness, top model launches, and LLM systems, delivered via Feishu Interactive Cards."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-daily = "ai_daily.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
